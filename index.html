<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RizTech — App Pages</title>
    <meta name="description" content="Official privacy policies and app pages for RizTech Android apps.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Outfit', -apple-system, sans-serif;
            background: #0a0f1d;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background-image: radial-gradient(at 0% 0%, rgba(37,99,235,0.15) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(16,185,129,0.1) 0px, transparent 50%);
        }
        .hero { text-align: center; margin-bottom: 56px; }
        .badge {
            display: inline-block;
            background: rgba(59,130,246,0.12);
            border: 1px solid rgba(59,130,246,0.4);
            color: #60a5fa;
            padding: 5px 16px;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 18px;
        }
        h1 { font-size: 2.8rem; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 10px; }
        .subtitle { color: #94a3b8; font-size: 1.05rem; }
        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 860px;
        }
        .app-card {
            background: rgba(22,30,49,0.75);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 28px;
            backdrop-filter: blur(12px);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .app-card:hover { transform: translateY(-3px); border-color: rgba(59,130,246,0.4); }
        .app-icon { font-size: 2.5rem; margin-bottom: 14px; }
        .app-name { font-size: 1.3rem; font-weight: 700; margin-bottom: 6px; }
        .app-id { font-size: 0.8rem; color: #64748b; font-family: monospace; margin-bottom: 14px; }
        .app-links { display: flex; flex-wrap: wrap; gap: 10px; }
        .link-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            color: #cbd5e1;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 0.85rem;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.15s ease;
        }
        .link-pill:hover { background: rgba(59,130,246,0.18); border-color: rgba(59,130,246,0.5); color: #fff; }
        footer { margin-top: 60px; text-align: center; color: #475569; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="hero">
        <div class="badge">🚀 RizTech</div>
        <h1>App Pages</h1>
        <p class="subtitle">Official privacy policies &amp; pages for RizTech Android apps</p>
    </div>

    <div class="apps-grid">
        <div class="app-card">
            <div class="app-icon">📚</div>
            <div class="app-name">Bookshelf</div>
            <div class="app-id">com.riztech.bookshelf</div>
            <p style="color:#94a3b8;font-size:0.9rem;margin-bottom:16px;">Creative digital notebooks, journals, and book management for Android.</p>
            <div class="app-links">
                <a href="bookshelf/privacy-policy.html" class="link-pill">🔒 Privacy Policy</a>
            </div>
        </div>

        <!-- Future apps can be added here -->
    </div>

    <footer>
        <p>&copy; 2026 RizTech. Hosted on GitHub Pages with HTTPS.</p>
    </footer>
</body>
</html>
